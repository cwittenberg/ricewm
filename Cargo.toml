[workspace]
resolver = "3"
members = [
    "crates/rice-i18n",
    "crates/rice-native-app-protocol",
    "crates/rice-display",
    "crates/rice-x11-core",
    "crates/rice-desktop",
    "crates/rice-box",
    "crates/rice-calc",
    "crates/rice-card",
    "crates/rice-day",
    "crates/rice-files",
    "crates/rice-view",
    "crates/rice-spatial",
    "crates/rice-image-contract",
    "crates/rice-tray",
    "crates/rice-web-render-protocol",
    "crates/rice-ui",
    "examples/core-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cwittenberg/ricewm"

[workspace.dependencies]
yserver-protocol = { git = "https://github.com/joske/yserver.git", rev = "f3de5026a9675bba0e449594a05d35c30ca5d53a" }
rice-i18n = { path = "crates/rice-i18n" }
rice-native-app-protocol = { path = "crates/rice-native-app-protocol" }
rice-display = { path = "crates/rice-display" }
rice-x11-core = { path = "crates/rice-x11-core" }
rice-desktop = { path = "crates/rice-desktop" }
rice-box = { path = "crates/rice-box" }
rice-calc = { path = "crates/rice-calc" }
rice-card = { path = "crates/rice-card" }
rice-day = { path = "crates/rice-day" }
rice-files = { path = "crates/rice-files" }
rice-view = { path = "crates/rice-view" }
rice-spatial = { path = "crates/rice-spatial" }
rice-image-contract = { path = "crates/rice-image-contract" }
rice-tray = { path = "crates/rice-tray" }
rice-web-render-protocol = { path = "crates/rice-web-render-protocol" }
rice-ui = { path = "crates/rice-ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
